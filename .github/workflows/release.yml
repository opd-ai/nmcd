name: Release

on:
  schedule:
    - cron: '0 0 * * *'  # Nightly at midnight UTC
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'  # Matches v1.2.3 pattern

permissions:
  contents: write
  packages: write

jobs:
  prepare:
    name: Prepare Release
    runs-on: ubuntu-latest
    outputs:
      is_nightly: ${{ steps.check.outputs.is_nightly }}
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check release type
        id: check
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            echo "is_nightly=true" >> $GITHUB_OUTPUT
          else
            echo "is_nightly=false" >> $GITHUB_OUTPUT
          fi

      - name: Determine version
        id: version
        run: |
          if [ "${{ steps.check.outputs.is_nightly }}" = "true" ]; then
            echo "version=nightly" >> $GITHUB_OUTPUT
          else
            echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
          fi

      - name: Delete existing nightly release
        if: steps.check.outputs.is_nightly == 'true'
        run: |
          # Delete the release if it exists
          gh release delete nightly --yes --cleanup-tag || true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Create or update nightly tag
        if: steps.check.outputs.is_nightly == 'true'
        run: |
          # Create/update the nightly tag to point to latest main
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -f nightly
          git push -f origin nightly
        continue-on-error: true

  build:
    name: Build Binaries
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          # Linux builds
          - goos: linux
            goarch: amd64
            artifact_name: nmcd-linux-amd64
          - goos: linux
            goarch: arm64
            artifact_name: nmcd-linux-arm64
          # macOS builds
          - goos: darwin
            goarch: amd64
            artifact_name: nmcd-darwin-amd64
          - goos: darwin
            goarch: arm64
            artifact_name: nmcd-darwin-arm64
          # Windows build
          - goos: windows
            goarch: amd64
            artifact_name: nmcd-windows-amd64.exe

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: Get version
        id: get_version
        run: echo "VERSION=${{ needs.prepare.outputs.version }}" >> $GITHUB_OUTPUT

      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          go build -v -trimpath \
            -ldflags="-s -w -X main.version=${{ steps.get_version.outputs.VERSION }}" \
            -o ${{ matrix.artifact_name }} \
            ./cmd/nmcd

      - name: Generate SHA256 checksum
        run: |
          sha256sum ${{ matrix.artifact_name }} > ${{ matrix.artifact_name }}.sha256

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            ${{ matrix.artifact_name }}
            ${{ matrix.artifact_name }}.sha256
          retention-days: 5

  permamail:
    name: Build Permamail Binaries
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            artifact_name: permamail-linux-amd64
          - goos: linux
            goarch: arm64
            artifact_name: permamail-linux-arm64
          - goos: darwin
            goarch: amd64
            artifact_name: permamail-darwin-amd64
          - goos: darwin
            goarch: arm64
            artifact_name: permamail-darwin-arm64
          - goos: windows
            goarch: amd64
            artifact_name: permamail-windows-amd64.exe

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: Get version
        id: get_version
        run: echo "VERSION=${{ needs.prepare.outputs.version }}" >> $GITHUB_OUTPUT

      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          go build -v -trimpath \
            -ldflags="-s -w -X main.version=${{ steps.get_version.outputs.VERSION }}" \
            -o ${{ matrix.artifact_name }} \
            ./cmd/permamail

      - name: Generate SHA256 checksum
        run: |
          sha256sum ${{ matrix.artifact_name }} > ${{ matrix.artifact_name }}.sha256

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            ${{ matrix.artifact_name }}
            ${{ matrix.artifact_name }}.sha256
          retention-days: 5

  release:
    name: Create GitHub Release
    needs: [prepare, build, permamail]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Prepare release assets
        run: |
          mkdir -p release/
          find artifacts/ -type f -exec cp {} release/ \;
          cd release/
          # Create combined checksums file
          cat *.sha256 > checksums.txt
          ls -lh

      - name: Get version
        id: get_version
        run: |
          if [ "${{ needs.prepare.outputs.is_nightly }}" = "true" ]; then
            echo "VERSION=nightly" >> $GITHUB_OUTPUT
            echo "TAG=nightly" >> $GITHUB_OUTPUT
          else
            echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
            echo "TAG=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Generate release notes
        id: release_notes
        run: |
          if [ "${{ needs.prepare.outputs.is_nightly }}" = "true" ]; then
            cat > release_notes.md << 'EOF'
          ## nmcd Nightly Build

          **⚠️ This is an automated nightly build from the latest main branch.**

          This build is updated daily and may contain unstable or experimental features.
          For production use, please use a stable versioned release.

          ### Build Information
          - **Built from**: Latest main branch
          - **Build date**: $(date -u '+%Y-%m-%d %H:%M:%S UTC')
          - **Commit**: ${{ github.sha }}

          ### Downloads

          Download the binary for your platform below. All binaries are statically linked with no external dependencies.

          **Linux:**
          - `nmcd-linux-amd64` - 64-bit Intel/AMD
          - `nmcd-linux-arm64` - 64-bit ARM (Raspberry Pi 3+, AWS Graviton, etc.)

          **macOS:**
          - `nmcd-darwin-amd64` - Intel Macs
          - `nmcd-darwin-arm64` - Apple Silicon (M1/M2/M3)

          **Windows:**
          - `nmcd-windows-amd64.exe` - 64-bit

          ### Verification

          Verify your download with SHA256 checksums:
          ```bash
          # Linux/macOS
          sha256sum -c nmcd-linux-amd64.sha256

          # Or check against checksums.txt
          grep nmcd-linux-amd64 checksums.txt
          ```

          ### Quick Start

          ```bash
          # Make binary executable (Linux/macOS)
          chmod +x nmcd-linux-amd64

          # Run daemon
          ./nmcd-linux-amd64 -network=mainnet
          ```

          See [README.md](https://github.com/opd-ai/nmcd#readme) for detailed documentation.
          EOF
          else
            cat > release_notes.md << EOF
          ## nmcd ${{ steps.get_version.outputs.VERSION }}

          Pure Go Namecoin implementation using btcd libraries.

          ### Downloads

          Download the binary for your platform below. All binaries are statically linked with no external dependencies.

          **Linux:**
          - \`nmcd-linux-amd64\` - 64-bit Intel/AMD
          - \`nmcd-linux-arm64\` - 64-bit ARM (Raspberry Pi 3+, AWS Graviton, etc.)

          **macOS:**
          - \`nmcd-darwin-amd64\` - Intel Macs
          - \`nmcd-darwin-arm64\` - Apple Silicon (M1/M2/M3)

          **Windows:**
          - \`nmcd-windows-amd64.exe\` - 64-bit

          ### Verification

          Verify your download with SHA256 checksums:
          \`\`\`bash
          # Linux/macOS
          sha256sum -c nmcd-linux-amd64.sha256

          # Or check against checksums.txt
          grep nmcd-linux-amd64 checksums.txt
          \`\`\`

          ### Docker

          Multi-architecture Docker images are available:
          \`\`\`bash
          docker pull ghcr.io/opd-ai/nmcd:${{ steps.get_version.outputs.VERSION }}
          docker pull ghcr.io/opd-ai/nmcd:latest
          \`\`\`

          ### Quick Start

          \`\`\`bash
          # Make binary executable (Linux/macOS)
          chmod +x nmcd-linux-amd64

          # Run daemon
          ./nmcd-linux-amd64 -network=mainnet
          \`\`\`

          See [README.md](https://github.com/opd-ai/nmcd#readme) for detailed documentation.

          ### Changes

          See [CHANGELOG.md](https://github.com/opd-ai/nmcd/blob/main/CHANGELOG.md) for detailed release notes.
          EOF
          fi
          cat release_notes.md

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          name: ${{ needs.prepare.outputs.is_nightly == 'true' && 'Nightly Build' || steps.get_version.outputs.VERSION }}
          tag_name: ${{ steps.get_version.outputs.TAG }}
          body_path: release_notes.md
          files: release/*
          draft: false
          prerelease: ${{ needs.prepare.outputs.is_nightly == 'true' || contains(github.ref, 'rc') || contains(github.ref, 'beta') || contains(github.ref, 'alpha') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker:
    name: Build and Push Docker Images
    needs: [prepare, release]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Get version
        id: get_version
        run: echo "VERSION=${{ needs.prepare.outputs.version }}" >> $GITHUB_OUTPUT

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/opd-ai/nmcd
          tags: |
            type=semver,pattern={{version}},enable=${{ needs.prepare.outputs.is_nightly == 'false' }}
            type=semver,pattern={{major}}.{{minor}},enable=${{ needs.prepare.outputs.is_nightly == 'false' }}
            type=semver,pattern={{major}},enable=${{ needs.prepare.outputs.is_nightly == 'false' }}
            type=raw,value=latest,enable=${{ needs.prepare.outputs.is_nightly == 'false' }}
            type=raw,value=nightly,enable=${{ needs.prepare.outputs.is_nightly == 'true' }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VERSION=${{ steps.get_version.outputs.VERSION }}
